<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서 등록/수정</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 id="formTitle" class="mb-0">도서 등록</h2>
    <a href="index.html" class="btn btn-secondary">← 목록으로</a>
  </div>

  <!-- 등록/수정 폼 -->
  <form id="bookForm">
    <div class="mb-3">
      <label for="title" class="form-label">제목 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="title" placeholder="2자 이상 입력" required>
    </div>
    <div class="mb-3">
      <label for="author" class="form-label">저자 <span class="text-danger">*</span></label>
      <input type="text" class="form-control" id="author" placeholder="2자 이상 입력" required>
    </div>
    <div class="mb-3">
      <label for="publisher" class="form-label">출판사</label>
      <input type="text" class="form-control" id="publisher" placeholder="출판사명">
    </div>
    <div class="mb-3">
      <label for="year" class="form-label">출판년도</label>
      <input type="date" class="form-control" id="year">
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn">등록</button>
    <a href="index.html" class="btn btn-secondary ms-2">취소</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="sub.js"></script>
</body>
</html>
