<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서관리 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #f0f2f5;
      padding: 30px 20px;
    }
    .container {
      max-width: 1100px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    h1 {
      color: #2c3e50;
      margin-bottom: 30px;
      font-weight: 700;
    }

    /* ── CREATE / EDIT 폼 섹션 ── */
    .form-section {
      background-color: #eef2ff;
      padding: 24px;
      border-radius: 10px;
      margin-bottom: 30px;
      border-left: 5px solid #4f6ef7;
    }
    .form-section h4 {
      color: #3a4fa1;
      margin-bottom: 16px;
      font-weight: 600;
    }
    #formMode {
      font-size: 0.78rem;
      padding: 2px 10px;
      border-radius: 20px;
    }

    /* ── 검색 & 필터 바 ── */
    .search-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 16px;
    }
    .search-bar .form-control {
      max-width: 340px;
    }

    /* ── 테이블 ── */
    table {
      margin-top: 4px;
    }
    thead th {
      vertical-align: middle;
      white-space: nowrap;
    }
    tbody td {
      vertical-align: middle;
    }
    .btn-action {
      padding: 3px 10px;
      font-size: 0.82rem;
    }

    /* ── 상세 보기 모달 필드 ── */
    .detail-label {
      font-weight: 600;
      color: #555;
      width: 90px;
    }
    .detail-value {
      color: #222;
    }

    /* ── 삭제 확인 모달 ── */
    #deleteModal .modal-header {
      background-color: #dc3545;
      color: white;
    }
    #deleteModal .btn-close {
      filter: invert(1);
    }

    /* ── 수정 모달 ── */
    #editModal .modal-header {
      background-color: #ffc107;
      color: #000;
    }

    /* ── 상세 모달 ── */
    #detailModal .modal-header {
      background-color: #0d6efd;
      color: white;
    }
    #detailModal .btn-close {
      filter: invert(1);
    }

    /* 빈 목록 안내 */
    #emptyMsg {
      text-align: center;
      color: #aaa;
      padding: 24px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="text-center"><i class="bi bi-book-half me-2"></i>도서관리 시스템</h1>

    <!-- ════════════════════════════════════
         CREATE  –  도서 등록 폼
    ════════════════════════════════════ -->
    <div class="form-section">
      <h4>
        <i class="bi bi-plus-circle me-1"></i>도서 등록
        <span id="formMode" class="badge bg-primary ms-2">등록 모드</span>
      </h4>
      <form id="bookForm">
        <!-- 수정 모드일 때 원본 인덱스를 추적하는 숨김 필드 -->
        <input type="hidden" id="editIndex" value="-1">

        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">도서번호 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="bookId" placeholder="예) BK-001" required>
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">제목 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="title" placeholder="도서 제목" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">저자 <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="author" placeholder="저자명" required>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">출판사</label>
            <input type="text" class="form-control" id="publisher" placeholder="출판사명">
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold">출판년도</label>
            <input type="date" class="form-control" id="year" min="1900" max="2099">
          </div>
          <div class="col-12 d-flex gap-2">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <i class="bi bi-save me-1"></i>등록
            </button>
            <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">
              <i class="bi bi-x-circle me-1"></i>취소
            </button>
          </div>
        </div>
      </form>
    </div>

    <!-- ════════════════════════════════════
         READ  –  도서 목록 & 검색
    ════════════════════════════════════ -->
    <div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-list-ul me-1"></i>도서 목록</h4>
        <span class="badge bg-secondary" id="countBadge">0 권</span>
      </div>

      <!-- 검색 바 -->
      <div class="search-bar">
        <input type="text" class="form-control" id="searchInput" placeholder="🔍  도서번호 / 제목 / 저자로 검색…">
        <select class="form-select" id="searchField" style="max-width:140px;">
          <option value="all">전체</option>
          <option value="bookId">도서번호</option>
          <option value="title">제목</option>
          <option value="author">저자</option>
          <option value="publisher">출판사</option>
        </select>
        <button class="btn btn-outline-secondary" id="clearSearchBtn" title="검색 초기화">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
      </div>

      <!-- 도서 목록 테이블 -->
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>도서번호</th>
              <th>제목</th>
              <th>저자</th>
              <th>출판사</th>
              <th>출판년도</th>
              <th class="text-center">관리</th>
            </tr>
          </thead>
          <tbody id="bookList">
            <!-- JS로 행이 삽입됩니다 -->
          </tbody>
        </table>
      </div>
      <p id="emptyMsg"><i class="bi bi-inbox"></i>&nbsp; 등록된 도서가 없습니다.</p>
    </div>
  </div><!-- /container -->



  <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="detailModalLabel"><i class="bi bi-info-circle me-1"></i>도서 상세 정보</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <table class="table table-borderless mb-0">
            <tbody>
              <tr>
                <td class="detail-label">도서번호</td>
                <td class="detail-value" id="d-bookId">—</td>
              </tr>
              <tr>
                <td class="detail-label">제목</td>
                <td class="detail-value" id="d-title">—</td>
              </tr>
              <tr>
                <td class="detail-label">저자</td>
                <td class="detail-value" id="d-author">—</td>
              </tr>
              <tr>
                <td class="detail-label">출판사</td>
                <td class="detail-value" id="d-publisher">—</td>
              </tr>
              <tr>
                <td class="detail-label">출판년도</td>
                <td class="detail-value" id="d-year">—</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
        </div>
      </div>
    </div>
  </div>


  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel"><i class="bi bi-pencil-square me-1"></i>수정 확인</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">
            <strong id="edit-title-confirm"></strong> 도서 정보를 수정하시겠습니까?
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-warning" id="confirmEditBtn">
            <i class="bi bi-check-lg me-1"></i>수정
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ════════════════════════════════════
       DELETE – 삭제 확인 모달
  ════════════════════════════════════ -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteModalLabel"><i class="bi bi-trash3 me-1"></i>삭제 확인</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-0">
            <strong id="delete-title-confirm"></strong> 도서를 정말 삭제하시겠습니까?<br>
            <small class="text-muted">이 작업은 되돌릴 수 없습니다.</small>
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
          <button type="button" class="btn btn-danger" id="confirmDeleteBtn">
            <i class="bi bi-trash3-fill me-1"></i>삭제
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
