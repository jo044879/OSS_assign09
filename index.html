<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>도서관리 시스템</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
  <h2 class="mb-3">도서관리 시스템</h2>

  <!-- 등록/수정 폼 -->
  <form id="bookForm" class="mb-4">
    <h5 id="formTitle">도서 등록</h5>
    <div class="row g-2 mb-2">
      <div class="col">
        <input type="text"  class="form-control" id="title"     placeholder="제목"   required>
      </div>
      <div class="col">
        <input type="text"  class="form-control" id="author"    placeholder="저자"   required>
      </div>
      <div class="col">
        <input type="text"  class="form-control" id="publisher" placeholder="출판사">
      </div>
      <div class="col">
        <input type="date"  class="form-control" id="year">
      </div>
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn">등록</button>
    <button type="button" class="btn btn-secondary" id="cancelBtn" style="display:none;">취소</button>
  </form>

  <!-- 검색 -->
  <input type="text" class="form-control mb-3" id="searchInput" placeholder="검색 (제목 / 저자 / 출판사)">

  <!-- 목록 -->
  <table class="table table-striped table-hover">
    <thead class="table-dark">
      <tr><th>ID</th><th>제목</th><th>저자</th><th>출판사</th><th>출판년도</th><th>관리</th></tr>
    </thead>
    <tbody id="bookList"></tbody>
  </table>
  <p id="emptyMsg" class="text-muted text-center" style="display:none;">등록된 도서가 없습니다.</p>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>
</html>
